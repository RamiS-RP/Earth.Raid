# Construye earth_raid.zip y lo publica como release de GitHub.
# Dos canales:
#   - estable: rama main -> release vX.Y.Z (la "latest": la que instalan los jugadores con Add-ons de BeamNG.Earth)
#   - beta:    rama beta -> pre-release vX.Y.Z-beta.N (para desarrolladores y probadores; no sustituye a la estable)
# El instalador de add-ons de BeamNG.Earth (Add from GitHub: RamiS-RP/Earth.Raid) descarga ese .zip de la última release.
# Se lanza: al subir a main un cambio de versión (M.VERSION en main.lua), al publicar una etiqueta v* o una release
# desde la web, o a mano (Actions → release → Run workflow).
name: release
on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: ver
        run: |
          V=$(grep -oE "M.VERSION = '[0-9.]+'" lua/ge/extensions/earthRaid/main.lua | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          if [ -n "${{ github.event.release.tag_name }}" ]; then TAG="${{ github.event.release.tag_name }}";
          elif [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}";
          elif [ "${{ github.ref_name }}" = "beta" ]; then TAG="v$V-beta.${{ github.run_number }}";
          else TAG="v$V"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          case "$TAG" in *-beta*) echo "beta=true" >> "$GITHUB_OUTPUT";; *) echo "beta=false" >> "$GITHUB_OUTPUT";; esac
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null && [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      # Copiloto en español DENTRO del paquete: la voz (Piper, es_ES-davefx-medium, generada de tools/voicepack/es.json)
      # está guardada en el repositorio (lua/ge/extensions/gameplay/rally/compositors/voicepacks/raidearth_es_davefx):
      # la publicación no depende de descargar el modelo (19-nov: esa descarga dejó colgada una publicación).
      # Solo se vuelve a generar si la carpeta no está (p. ej. tras cambiar es.json y borrarla), con tiempo límite.
      - name: Co-driver voice (only if it is not in the repository)
        if: steps.ver.outputs.skip != 'true' && hashFiles('lua/ge/extensions/gameplay/rally/compositors/voicepacks/raidearth_es_davefx/voicepack.json') == ''
        continue-on-error: true
        timeout-minutes: 8
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          pip install piper-tts
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/davefx/medium
          curl -fsSL --retry 3 --max-time 180 -o /tmp/es.onnx "$B/es_ES-davefx-medium.onnx"
          curl -fsSL --retry 3 --max-time 60 -o /tmp/es.onnx.json "$B/es_ES-davefx-medium.onnx.json"
          python tools/voicepack/make_voicepack.py --phrases tools/voicepack/es.json --engine piper --model /tmp/es.onnx \
            --id raidearth_es_davefx --persona "Copiloto en español (Piper)" --dialect es-ES --out .
      - name: Package
        if: steps.ver.outputs.skip != 'true'
        run: sh tools/package.sh earth_raid.zip
      - name: Voices in the package
        if: steps.ver.outputs.skip != 'true'
        run: |
          N=$(unzip -l earth_raid.zip | grep -c "compositors/voicepacks/.*\.ogg$" || true)
          echo "co-driver audio files in earth_raid.zip: $N"
          [ "$N" -gt 0 ] || echo "::warning::earth_raid.zip has no co-driver voice (the voice step failed): the game's co-drivers will be used"
      - name: Check layout (mod folders at the zip root)
        if: steps.ver.outputs.skip != 'true'
        run: |
          unzip -l earth_raid.zip | grep -q " lua/ge/extensions/earthRaid/main.lua$"
          unzip -l earth_raid.zip | grep -q " ui/ui-vue/mods/earthRaid/index.js$"
          unzip -l earth_raid.zip | grep -q " scripts/earth_raid/modScript.lua$"
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Earth.Raid ${{ steps.ver.outputs.tag }}${{ steps.ver.outputs.beta == 'true' && ' (beta)' || '' }}
          files: earth_raid.zip
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.beta == 'true' }}
          make_latest: ${{ steps.ver.outputs.beta == 'true' && 'false' || 'true' }}
