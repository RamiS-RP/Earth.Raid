# Construye earth_raid.zip y lo publica como release de GitHub.
# El instalador de add-ons de BeamNG.Earth (Add from GitHub: RamiroRP/earth.raid) descarga ese .zip de la última release.
# Se lanza: al subir a main un cambio de versión (M.VERSION en main.lua), al publicar una etiqueta v* o una release
# desde la web, o a mano (Actions → release → Run workflow).
name: release
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: ver
        run: |
          V=$(grep -oE "M.VERSION = '[0-9.]+'" lua/ge/extensions/earthRaid/main.lua | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          if [ -n "${{ github.event.release.tag_name }}" ]; then TAG="${{ github.event.release.tag_name }}";
          elif [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}";
          else TAG="v$V"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null && [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: Package
        if: steps.ver.outputs.skip != 'true'
        run: sh tools/package.sh earth_raid.zip
      - name: Check layout (mod folders at the zip root)
        if: steps.ver.outputs.skip != 'true'
        run: |
          unzip -l earth_raid.zip | grep -q " lua/ge/extensions/earthRaid/main.lua$"
          unzip -l earth_raid.zip | grep -q " ui/ui-vue/mods/earthRaid/index.js$"
          unzip -l earth_raid.zip | grep -q " scripts/earth_raid/modScript.lua$"
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Raid.Earth ${{ steps.ver.outputs.tag }}
          files: earth_raid.zip
          generate_release_notes: true
          make_latest: true
  # Copiloto en español: voicepack generado con Piper (voz neuronal) a partir de tools/voicepack/es.json.
  # Se adjunta a la misma release como earth_raid_voice_es.zip (un mod aparte, opcional). Si falla, la release sigue.
  voice_es:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: |
          V=$(grep -oE "M.VERSION = '[0-9.]+'" lua/ge/extensions/earthRaid/main.lua | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          TAG="${{ github.event.release.tag_name }}"; [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ] && TAG="${{ github.ref_name }}"; [ -z "$TAG" ] && TAG="v$V"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Tools
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          pip install piper-tts
      - name: Voice model (Piper es_ES-davefx-medium)
        run: |
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/davefx/medium
          curl -fsSL -o es.onnx "$B/es_ES-davefx-medium.onnx"
          curl -fsSL -o es.onnx.json "$B/es_ES-davefx-medium.onnx.json"
          curl -fsSL -o MODEL_CARD.txt "$B/MODEL_CARD" || true
      - name: Build voicepack
        run: |
          python tools/voicepack/make_voicepack.py --phrases tools/voicepack/es.json --engine piper --model es.onnx \
            --id raidearth_es_davefx --persona "Copiloto Raid.Earth" --dialect es-ES --out build_voice \
            --zip earth_raid_voice_es.zip
          cp MODEL_CARD.txt build_voice/ 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: earth_raid_voice_es.zip
